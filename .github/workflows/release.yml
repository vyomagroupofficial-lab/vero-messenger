name: Release

# Builds every client and attaches them to a GitHub Release:
#   Android APK, web build (zip), desktop apps (Windows .exe, macOS .dmg, Linux AppImage/.deb).
# Trigger: push a tag like v1.0.0  (git tag v1.0.0 && git push origin v1.0.0)
#          or run it manually from the Actions tab.

on:
  push:
    tags: ['v*']
    # Dry run (build everything, publish nothing) when this file changes on a branch.
    branches: ['claude/**']
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Public client config (safe to ship in the app). Override with repository variables.
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://fihspzqhrvlsfwbkitgm.supabase.co' }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpaHNwenFocnZsc2Z3YmtpdGdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwNTA3NzIsImV4cCI6MjEwNjYyNjc3Mn0.9JnVwDuzfs1USbaJeKBRInlDLWAP-GAHoH9Kfg7bO64' }}
  CI: 'true'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: vero
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vero/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install --clean
      - name: Signing key
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "args=-Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.keystore -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with a throwaway debug key, so later builds can't install over it. See vero/RELEASING.md."
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK
        working-directory: vero/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a ${{ steps.sign.outputs.args }} --no-daemon
      - run: |
          mkdir -p ../out
          cp android/app/build/outputs/apk/release/app-release.apk "../out/Vero-${GITHUB_REF_NAME//\//-}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vero
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vero/package-lock.json
      - run: npm ci
      - run: npx expo export --platform web --output-dir dist --clear
      - run: |
          mkdir -p ../out
          (cd dist && zip -qr "../../out/Vero-web-${GITHUB_REF_NAME//\//-}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: out/*.zip

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
          - os: ubuntu-latest
            script: build:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: vero
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            vero/package-lock.json
            vero/desktop/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: vero/desktop
      - run: npm run ${{ matrix.script }} -- --publish never
        working-directory: vero/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned until signing certificates are added
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            vero/desktop/release/*.exe
            vero/desktop/release/*.dmg
            vero/desktop/release/*.AppImage
            vero/desktop/release/*.deb
            vero/desktop/release/*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, web, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
