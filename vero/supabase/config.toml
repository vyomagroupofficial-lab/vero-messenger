# Supabase CLI config (only the settings Vero relies on).
project_id = "vero"

# Called by the database (pg_net trigger, 005) / scheduler. send-push checks
# the x-webhook-secret header against the Vault secret push_webhook_secret (or
# a caller's JWT for their own ringing call); cleanup functions use CRON_SECRET.
[functions.send-push]
verify_jwt = false

[functions.cleanup-expired]
verify_jwt = false

[functions.stories-cleanup]
verify_jwt = false

# Called by signed-out devices (QR login); signed-in actions check the JWT itself.
[functions.device-link]
verify_jwt = false

# Search requests verify the user JWT inside the function; preview/GIF
# downloads use short-lived HMAC-signed URLs (so <img> tags can load them).
[functions.gif-search]
verify_jwt = false
